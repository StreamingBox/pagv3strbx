# Plantilla Nginx para strbx.com.co.
# Copiar a /etc/nginx/sites-available/streaming-box y enlazar desde sites-enabled.

server {
    listen 80;
    server_name strbx.com.co www.strbx.com.co;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name strbx.com.co www.strbx.com.co;

    root /var/www/pagv2strbx/frontend/dist;
    index index.html;

    # TLS: completar con la ruta real del certificado del VPS.
    # ssl_certificate /etc/letsencrypt/live/strbx.com.co/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/strbx.com.co/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self' https://strbx.com.co https://www.strbx.com.co; font-src 'self' https://fonts.gstatic.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;

    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
