# Plantilla Nginx para strbx.com.co.
# Copiar a /etc/nginx/sites-available/streaming-box y enlazar desde sites-enabled.

server {
    listen 80;
    server_name strbx.com.co www.strbx.com.co;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name strbx.com.co www.strbx.com.co;

    root /var/www/pageV3/frontend/current;
    index index.html;
    client_max_body_size 64M;

    # TLS: completar con la ruta real del certificado del VPS.
    # ssl_certificate /etc/letsencrypt/live/strbx.com.co/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/strbx.com.co/privkey.pem;

    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        include /etc/nginx/snippets/strbx-security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
