# Copiar a EC2:
#   sudo cp scripts/nginx-site-strbx.com.co.conf /etc/nginx/sites-available/strbx
#   sudo ln -sf /etc/nginx/sites-available/strbx /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Luego HTTPS:
#   sudo certbot --nginx -d strbx.com.co -d www.strbx.com.co
#
# Ajusta root si el clon no está en /var/www/pageV3

server {
    listen 80;
    server_name strbx.com.co www.strbx.com.co;

    root /var/www/pageV3/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
